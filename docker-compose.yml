version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eslatma-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: eslatma
      POSTGRES_PASSWORD: eslatma_dev_password
      POSTGRES_DB: eslatma_daftari
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eslatma -d eslatma_daftari"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: Redis for session storage in production
  # redis:
  #   image: redis:7-alpine
  #   container_name: eslatma-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"

volumes:
  postgres_data:
